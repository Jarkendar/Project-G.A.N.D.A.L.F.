[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imladris-rag"
version = "0.1.0"
description = "A small, CPU-friendly retrieval engine for markdown corpora (runs on a Raspberry Pi 5)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.0",
    "sentence-transformers==5.6.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client==1.19.1"]  # the Qdrant store; the server itself: docker-compose.yml

[tool.setuptools.packages.find]
include = ["imladris*"]
